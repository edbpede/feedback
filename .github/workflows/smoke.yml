# Tier-1 smoke test: boot the app and prove the route loads.
#
# Deliberately NOT a browser test. It verifies that the app boots and serves
# real content. It will NOT catch client-side breakage: a server-rendered page
# returns 200 with a valid <title> even when a solid-js or unocss bump has
# broken island hydration — and this app's entire UI is one `client:idle`
# island, so that gap is wider here than elsewhere. Upgrading to a real browser
# test is a separate decision, not something to bolt on here.
#
# This repo serves via `astro dev`, not `astro preview`, because the Vercel
# adapter refuses preview outright:
#   [preview] The @astrojs/vercel adapter does not support the preview command.
# That makes this a weaker signal than the static repos get — the dev server,
# not the production bundle. The production compile is already covered: code-quality.yml
# runs `bun run build` on every push and pull request.
name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only throughout. Unlike code-quality.yml there is no write-capable job
# here, and no biome-migrate job — that belongs solely to the quality gate.
permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Serve · load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Derived from the committed `packageManager` field, not `latest`.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Serve and smoke-test routes
        # astro.config.ts declares `validateSecrets: true`, so the server refuses
        # to start unless these three are present. They are the same throwaway
        # placeholders code-quality.yml already uses for its build, and exist
        # only to satisfy that schema check — nothing here contacts the API, and
        # no real secret belongs in a workflow file. PASSWORD_HASH is the SHA-256
        # of the empty string, exactly as committed in .env.example.
        env:
          PASSWORD_HASH: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          SESSION_SECRET: ci-build-only-placeholder-not-a-real-secret
          NANO_GPT_API_KEY: ci-build-only-placeholder-not-a-real-key
        run: |
          set -euo pipefail

          # `--host 127.0.0.1` is explicit on purpose: Astro otherwise binds the
          # name `localhost`, which can resolve to ::1 first, while the probes
          # below dial IPv4 literally.
          bun run dev -- --host 127.0.0.1 --port 4321 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT

          # Readiness loop, deliberately NOT `curl --retry`: this distinguishes
          # "not up yet" from "up but broken", so a real 500 fails fast instead
          # of being retried into a timeout.
          timeout 90 bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:4321/; do sleep 1; done'

          # Assert on CONTENT, not just status — a 200 error page would sail
          # through a status-only check.
          #
          # The body goes to a file rather than into `curl ... | grep -q`:
          # grep -q exits at the first match, curl then dies of SIGPIPE with
          # exit 23, and `pipefail` turns that into a failure. This page is ~90 KB,
          # which is exactly the size range where the piped form starts failing
          # intermittently — it was observed flapping locally on this very route.
          #
          # `/` is the only page route; everything else in src/pages is /api/**,
          # and those need a session or a live upstream.
          for path in /; do
            echo "==> ${path}"
            curl -fsS -m 10 -o "${RUNNER_TEMP}/page.html" "http://127.0.0.1:4321${path}"
            grep -q '<title>' "${RUNNER_TEMP}/page.html" \
              || { echo "SMOKE FAILED: ${path} served no <title>"; exit 1; }
          done
