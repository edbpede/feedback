name: quality
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.20.0
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/cache@v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - run: bun install --frozen-lockfile
    - uses: j178/prek-action@v3.0.0
      with:
        # renovate: datasource=github-releases depName=j178/prek
        prek-version: 0.5.2
        extra-args: --all-files --hook-stage manual
      env:
        SKIP: no-commit-to-branch
    - run: bash scripts/ci/check.sh
    - run: git diff --exit-code HEAD
    - name: Preserve the built function and static files
      run: tar -C .vercel -czf "$RUNNER_TEMP/vercel-output.tar.gz" output
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: vercel-build
        path: ${{ runner.temp }}/vercel-output.tar.gz
        if-no-files-found: error
        retention-days: 1
